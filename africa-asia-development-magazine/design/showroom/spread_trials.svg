<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2100 2970" role="img" aria-labelledby="title desc">
  <title id="title">Three Ghana and South Korea editorial spread treatments</title>
  <desc id="desc">An A4-proportioned showroom sheet comparing Evidence Ledger, Paired Field Notes, and Question Reveal Qualification treatments. Every treatment uses the same approved GDP per capita values for Ghana and South Korea in 1960, 1990, and 2020, with a shared zero to 35,000 scale, source note, and causal limitation.</desc>
  <defs>
    <style><![CDATA[
      .sans { font-family: "Arial", "Helvetica Neue", sans-serif; fill: #252525; }
      .serif { font-family: "Georgia", "Times New Roman", serif; fill: #252525; }
      .sheet-title { font-size: 54px; font-weight: 800; letter-spacing: -1px; }
      .sheet-deck { font-size: 24px; font-weight: 450; fill: #4A4742; }
      .version { font-size: 24px; font-weight: 800; letter-spacing: 2px; }
      .question { font-size: 22px; font-weight: 600; fill: #4A4742; }
      .spread-title { font-size: 38px; font-weight: 800; letter-spacing: -0.5px; }
      .spread-display { font-size: 76px; font-weight: 800; letter-spacing: -2px; }
      .sub { font-size: 20px; font-weight: 600; fill: #4A4742; }
      .body { font-size: 18px; font-weight: 450; fill: #363431; }
      .small { font-size: 16px; font-weight: 500; fill: #4A4742; }
      .tiny { font-size: 14px; font-weight: 550; fill: #4A4742; }
      .axis { font-size: 16px; font-weight: 700; fill: #514E48; }
      .value { font-size: 18px; font-weight: 800; fill: #252525; }
      .country { font-size: 20px; font-weight: 800; }
      .panel { fill: #F4F0E7; stroke: #252525; stroke-width: 3; }
      .page { fill: #FBF8F1; stroke: #B7B0A4; stroke-width: 2; }
      .rule { stroke: #B7B0A4; stroke-width: 2; }
      .grid { stroke: #D9D3C8; stroke-width: 1.5; }
      .base { stroke: #514E48; stroke-width: 2.5; }
      .ghana { stroke: #B95332; fill: none; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
      .korea { stroke: #315A78; fill: none; stroke-width: 6; stroke-dasharray: 20 12; stroke-linecap: butt; stroke-linejoin: round; }
      .placeholder { fill: #E6E0D5; stroke: #625E57; stroke-width: 2; stroke-dasharray: 10 8; }
      .limit { fill: #E9E2D7; stroke: #514E48; stroke-width: 2; }
      .warm { fill: #B95332; }
      .cool { fill: #315A78; }
      .reverse { fill: #FBF8F1; }
      .cream-stroke { stroke: #F4F0E7; stroke-width: 4; }
      .ink-stroke { stroke: #252525; stroke-width: 1.2; }
    ]]></style>
    <g id="gdot">
      <circle r="10" fill="#B95332" class="cream-stroke"/>
      <circle r="10" fill="none" class="ink-stroke"/>
    </g>
    <g id="kdot">
      <path d="M0,-12 L12,0 L0,12 L-12,0 Z" fill="#315A78" class="cream-stroke" stroke-linejoin="round"/>
      <path d="M0,-12 L12,0 L0,12 L-12,0 Z" fill="none" class="ink-stroke" stroke-linejoin="round"/>
    </g>
  </defs>

  <rect width="2100" height="2970" fill="#EEE9DE"/>
  <text x="105" y="92" class="sans sheet-title">One comparison. Three editorial systems.</text>
  <text x="105" y="136" class="sans sheet-deck">DESIGN-001 · Same approved evidence in every treatment · A4 showroom proof · User selection required</text>

  <!-- VERSION A -->
  <g id="version-a" transform="translate(85 185)">
    <rect width="1930" height="820" rx="8" class="panel"/>
    <text x="35" y="45" class="sans version">A · EVIDENCE LEDGER</text>
    <text x="35" y="78" class="sans question">Design question: should the audited proof chart remain the dominant editorial language?</text>

    <g transform="translate(35 110)">
      <rect width="1860" height="670" class="page"/>
      <line x1="930" y1="0" x2="930" y2="670" class="rule"/>
      <text x="45" y="48" class="sans tiny">GHANA × SOUTH KOREA · OBSERVED ANCHORS</text>
      <text x="45" y="100" class="sans spread-title">Near parity in 1960. Nearly 17-to-1 by 2020.</text>
      <text x="45" y="135" class="sans sub">GDP per capita · constant 2015 US$ · 1960, 1990, 2020</text>

      <g transform="translate(65 175)">
        <line x1="85" y1="0" x2="1175" y2="0" class="grid"/>
        <line x1="85" y1="92" x2="1175" y2="92" class="grid"/>
        <line x1="85" y1="184" x2="1175" y2="184" class="grid"/>
        <line x1="85" y1="276" x2="1175" y2="276" class="base"/>
        <text x="70" y="6" text-anchor="end" class="sans axis">35k</text>
        <text x="70" y="98" text-anchor="end" class="sans axis">23k</text>
        <text x="70" y="190" text-anchor="end" class="sans axis">12k</text>
        <text x="70" y="282" text-anchor="end" class="sans axis">0</text>
        <path d="M210,267 L610,269 L1010,260" class="ghana"/>
        <path d="M210,268 L610,200 L1010,14" class="korea"/>
        <use href="#gdot" transform="translate(210 267)"/>
        <use href="#gdot" transform="translate(610 269)"/>
        <use href="#gdot" transform="translate(1010 260)"/>
        <use href="#kdot" transform="translate(210 268)"/>
        <use href="#kdot" transform="translate(610 200)"/>
        <use href="#kdot" transform="translate(1010 14)"/>
        <text x="210" y="315" text-anchor="middle" class="sans axis">1960</text>
        <text x="610" y="315" text-anchor="middle" class="sans axis">1990</text>
        <text x="1010" y="315" text-anchor="middle" class="sans axis">2020</text>
        <text x="140" y="245" class="sans value">$1,101 / $1,038</text>
        <text x="610" y="181" text-anchor="middle" class="sans value">Korea $9,673</text>
        <text x="610" y="250" text-anchor="middle" class="sans value">Ghana $856</text>
        <use href="#kdot" transform="translate(1035 5)"/>
        <text x="1060" y="2" class="sans country">South Korea</text>
        <text x="1060" y="26" class="sans value">$33,216</text>
        <use href="#gdot" transform="translate(1035 255)"/>
        <text x="1060" y="250" class="sans country">Ghana</text>
        <text x="1060" y="274" class="sans value">$1,970</text>
      </g>

      <g transform="translate(1285 175)">
        <rect width="515" height="175" class="placeholder"/>
        <text x="257" y="75" text-anchor="middle" class="sans sub">PHOTO PLACEHOLDER</text>
        <text x="257" y="104" text-anchor="middle" class="sans small">UNAPPROVED · country, place, date,</text>
        <text x="257" y="128" text-anchor="middle" class="sans small">creator, licence, and role required</text>
        <text x="0" y="222" class="sans sub">OBSERVED ANCHORS ONLY</text>
        <text x="0" y="251" class="sans small">Straight connectors guide the eye.</text>
        <text x="0" y="275" class="sans small">They do not estimate annual values.</text>
        <rect y="305" width="515" height="125" class="limit"/>
        <text x="18" y="337" class="sans sub">WHAT THIS CANNOT PROVE</text>
        <text x="18" y="367" class="sans small">The gap does not identify whether culture,</text>
        <text x="18" y="391" class="sans small">policy, institutions, war, aid, or another</text>
        <text x="18" y="415" class="sans small">factor caused it. 2020 is a pandemic year.</text>
      </g>
      <line x1="45" y1="610" x2="1815" y2="610" class="rule"/>
      <text x="45" y="640" class="sans tiny">Data from World Development Indicators, NY.GDP.PCAP.KD, World Bank (2026) · SRC-WDI-001 · exact values in data/charts/ghana_korea_gdp_per_capita.csv</text>
    </g>
  </g>

  <!-- VERSION B -->
  <g id="version-b" transform="translate(85 1070)">
    <rect width="1930" height="820" rx="8" class="panel"/>
    <text x="35" y="45" class="sans version">B · PAIRED FIELD NOTES</text>
    <text x="35" y="78" class="sans question">Design question: can equal country presence feel human without breaking the shared scale?</text>

    <g transform="translate(35 110)">
      <rect width="1860" height="670" class="page"/>
      <rect width="930" height="670" fill="#F6EDE7"/>
      <rect x="930" width="930" height="670" fill="#EAF0F3"/>
      <line x1="930" y1="0" x2="930" y2="670" stroke="#252525" stroke-width="4"/>
      <text x="45" y="50" class="sans version warm">GHANA · ○ · SOLID</text>
      <text x="1815" y="50" text-anchor="end" class="sans version cool">SOUTH KOREA · ◇ · DASHED</text>
      <text x="930" y="48" text-anchor="middle" class="sans tiny">ONE SHARED 0–35,000 SCALE</text>

      <text x="45" y="112" class="serif spread-title">Same starting line?</text>
      <text x="1815" y="112" text-anchor="end" class="serif spread-title">Different 2020 outcome.</text>

      <g transform="translate(120 165)">
        <line x1="0" y1="0" x2="1620" y2="0" class="grid"/>
        <line x1="0" y1="92" x2="1620" y2="92" class="grid"/>
        <line x1="0" y1="184" x2="1620" y2="184" class="grid"/>
        <line x1="0" y1="276" x2="1620" y2="276" class="base"/>
        <text x="200" y="304" text-anchor="middle" class="sans axis">1960</text>
        <text x="810" y="304" text-anchor="middle" class="sans axis">1990</text>
        <text x="1420" y="304" text-anchor="middle" class="sans axis">2020</text>

        <path d="M200,267 L810,269 L1420,260" class="ghana"/>
        <path d="M200,268 L810,200 L1420,14" class="korea"/>
        <use href="#gdot" transform="translate(200 267)"/>
        <use href="#gdot" transform="translate(810 269)"/>
        <use href="#gdot" transform="translate(1420 260)"/>
        <use href="#kdot" transform="translate(200 268)"/>
        <use href="#kdot" transform="translate(810 200)"/>
        <use href="#kdot" transform="translate(1420 14)"/>
        <text x="120" y="244" text-anchor="end" class="sans value">Ghana $1,101</text>
        <text x="275" y="244" class="sans value">Korea $1,038</text>
        <text x="810" y="183" text-anchor="middle" class="sans value">$9,673</text>
        <text x="810" y="252" text-anchor="middle" class="sans value">$856</text>
        <text x="1420" y="-10" text-anchor="middle" class="sans value">$33,216</text>
        <text x="1420" y="246" text-anchor="middle" class="sans value">$1,970</text>
      </g>

      <g transform="translate(45 500)">
        <rect width="390" height="95" class="placeholder"/>
        <text x="195" y="40" text-anchor="middle" class="sans small">GHANA PHOTO · UNAPPROVED</text>
        <text x="195" y="65" text-anchor="middle" class="sans tiny">documentary context, not causal evidence</text>
        <text x="420" y="24" class="sans sub">Field note</text>
        <text x="420" y="52" class="sans small">Historical annotation space opens only</text>
        <text x="420" y="76" class="sans small">after copy and citation approval.</text>
      </g>
      <g transform="translate(995 500)">
        <text x="0" y="24" class="sans sub">Field note</text>
        <text x="0" y="52" class="sans small">Historical annotation space opens only</text>
        <text x="0" y="76" class="sans small">after copy and citation approval.</text>
        <rect x="425" width="390" height="95" class="placeholder"/>
        <text x="620" y="40" text-anchor="middle" class="sans small">KOREA PHOTO · UNAPPROVED</text>
        <text x="620" y="65" text-anchor="middle" class="sans tiny">documentary context, not causal evidence</text>
      </g>
      <line x1="45" y1="615" x2="1815" y2="615" class="rule"/>
      <text x="45" y="642" class="sans tiny">Observed anchors only · Same causal limitation and source as Version A · World Bank (2026), NY.GDP.PCAP.KD, SRC-WDI-001 · 2020 is a pandemic year</text>
    </g>
  </g>

  <!-- VERSION C -->
  <g id="version-c" transform="translate(85 1955)">
    <rect width="1930" height="900" rx="8" class="panel"/>
    <text x="35" y="45" class="sans version">C · QUESTION, REVEAL, QUALIFICATION</text>
    <text x="35" y="78" class="sans question">Design question: can a question-first sequence improve recall while keeping method and limitation visible?</text>

    <g transform="translate(35 110)">
      <rect width="1860" height="750" class="page"/>
      <rect width="770" height="750" fill="#B95332"/>
      <line x1="770" y1="0" x2="770" y2="750" stroke="#252525" stroke-width="4"/>

      <text x="55" y="58" class="sans version reverse">THE QUESTION</text>
      <text x="55" y="155" class="serif spread-display reverse">Same</text>
      <text x="55" y="230" class="serif spread-display reverse">starting</text>
      <text x="55" y="305" class="serif spread-display reverse">line?</text>
      <text x="55" y="360" class="sans sub reverse">1960 GDP per person</text>
      <text x="55" y="405" class="sans spread-title reverse">Ghana $1,101</text>
      <text x="55" y="450" class="sans spread-title reverse">Korea $1,038</text>
      <rect x="55" y="500" width="660" height="150" fill="#A54A30" stroke="#FBF8F1" stroke-width="2" stroke-dasharray="12 9"/>
      <text x="385" y="558" text-anchor="middle" class="sans sub reverse">PHOTO PLACEHOLDER · UNAPPROVED</text>
      <text x="385" y="590" text-anchor="middle" class="sans small reverse">place, date, creator, licence, and analytical role required</text>
      <text x="55" y="705" class="sans tiny reverse">Question first. Evidence answers on the facing page.</text>

      <g transform="translate(820 35)">
        <text x="0" y="35" class="sans version">THE REVEAL</text>
        <text x="0" y="86" class="sans spread-title">Nearly 17-to-1 by 2020.</text>
        <text x="0" y="120" class="sans sub">GDP per capita · constant 2015 US$ · shared 0–35,000 scale</text>

        <g transform="translate(70 165)">
          <line x1="0" y1="0" x2="840" y2="0" class="grid"/>
          <line x1="0" y1="90" x2="840" y2="90" class="grid"/>
          <line x1="0" y1="180" x2="840" y2="180" class="grid"/>
          <line x1="0" y1="270" x2="840" y2="270" class="base"/>
          <path d="M80,261 L420,263 L760,254" class="ghana"/>
          <path d="M80,262 L420,195 L760,14" class="korea"/>
          <use href="#gdot" transform="translate(80 261)"/>
          <use href="#gdot" transform="translate(420 263)"/>
          <use href="#gdot" transform="translate(760 254)"/>
          <use href="#kdot" transform="translate(80 262)"/>
          <use href="#kdot" transform="translate(420 195)"/>
          <use href="#kdot" transform="translate(760 14)"/>
          <text x="80" y="302" text-anchor="middle" class="sans axis">1960</text>
          <text x="420" y="302" text-anchor="middle" class="sans axis">1990</text>
          <text x="760" y="302" text-anchor="middle" class="sans axis">2020</text>
          <text x="420" y="176" text-anchor="middle" class="sans value">Korea $9,673</text>
          <text x="420" y="245" text-anchor="middle" class="sans value">Ghana $856</text>
          <text x="790" y="8" class="sans value">Korea $33,216</text>
          <text x="790" y="248" class="sans value">Ghana $1,970</text>
        </g>

        <rect x="0" y="505" width="985" height="120" class="limit"/>
        <text x="20" y="538" class="sans sub">THE QUALIFICATION</text>
        <text x="20" y="568" class="sans small">The income gap does not identify whether culture, policy, institutions, war, aid, or another</text>
        <text x="20" y="592" class="sans small">factor caused it. 2020 is the COVID-19 year. Connectors join observed anchors only.</text>
        <text x="0" y="673" class="sans tiny">Data from World Development Indicators, NY.GDP.PCAP.KD, World Bank (2026) · SRC-WDI-001</text>
        <text x="0" y="700" class="sans tiny">Exact values: data/charts/ghana_korea_gdp_per_capita.csv · No palette or spread direction is approved yet.</text>
      </g>
    </g>
  </g>

  <text x="105" y="2918" class="sans small">Showroom rule: compare composition, hierarchy, and tone. Do not compare different evidence. Select or combine elements in DESIGN_SHOWROOM.md.</text>
</svg>
