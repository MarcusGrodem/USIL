<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 1100" role="img" aria-labelledby="chart-title chart-desc">
  <title id="chart-title">Near parity in 1960; nearly 17-to-1 by 2020</title>
  <desc id="chart-desc">A shared-axis comparison of Ghana and South Korea GDP per capita in constant 2015 US dollars at three observed years: 1960, 1990, and 2020. Ghana is shown with terracotta circles and a solid line; South Korea with blue diamonds and a dashed line. Ghana values are 1,101, 856, and 1,970 dollars. South Korea values are 1,038, 9,673, and 33,216 dollars. Straight connectors guide the eye and do not show annual observations. The chart cannot establish what caused the divergence.</desc>

  <defs>
    <style><![CDATA[
      .display { font-family: "Aptos Display", "Helvetica Neue", sans-serif; fill: #252525; }
      .text { font-family: "Aptos", "Helvetica Neue", sans-serif; fill: #252525; }
      .title { font-size: 58px; font-weight: 750; letter-spacing: -1.2px; }
      .subtitle { font-size: 28px; font-weight: 450; }
      .eyebrow { font-size: 20px; font-weight: 700; letter-spacing: 2.2px; }
      .axis-label { font-size: 22px; font-weight: 650; fill: #514E48; }
      .year { font-size: 24px; font-weight: 700; fill: #252525; }
      .value { font-size: 25px; font-weight: 750; font-variant-numeric: tabular-nums; fill: #252525; }
      .country { font-size: 25px; font-weight: 750; fill: #252525; }
      .note-head { font-size: 21px; font-weight: 750; fill: #252525; }
      .note { font-size: 20px; font-weight: 450; fill: #403D38; }
      .grid { stroke: #B7B0A4; stroke-width: 2; }
      .baseline { stroke: #514E48; stroke-width: 3; }
      .leader { stroke: #6A655D; stroke-width: 2; fill: none; }
    ]]></style>

    <symbol id="ghana-circle" viewBox="-16 -16 32 32">
      <circle cx="0" cy="0" r="11" fill="#B95332" stroke="#F4F0E7" stroke-width="5"/>
      <circle cx="0" cy="0" r="11" fill="none" stroke="#252525" stroke-width="1.5"/>
    </symbol>
    <symbol id="korea-diamond" viewBox="-18 -18 36 36">
      <path d="M0,-14 L14,0 L0,14 L-14,0 Z" fill="#315A78" stroke="#F4F0E7" stroke-width="5" stroke-linejoin="round"/>
      <path d="M0,-14 L14,0 L0,14 L-14,0 Z" fill="none" stroke="#252525" stroke-width="1.5" stroke-linejoin="round"/>
    </symbol>
  </defs>

  <rect width="1600" height="1100" fill="#F4F0E7"/>

  <g id="heading">
    <text x="100" y="72" class="text eyebrow">GHANA × SOUTH KOREA · THREE OBSERVED ANCHORS</text>
    <text id="chart-title-visible" x="100" y="142" class="display title">Near parity in 1960. Nearly 17-to-1 by 2020.</text>
    <text x="100" y="190" class="text subtitle">GDP per capita · constant 2015 US$ · 1960, 1990, and 2020</text>
  </g>

  <g id="plot" aria-label="Shared axis from zero to 35,000 constant 2015 US dollars">
    <text x="220" y="263" class="text axis-label">CONSTANT 2015 US$ PER PERSON</text>

    <g id="gridlines">
      <line x1="220" y1="310" x2="1450" y2="310" class="grid"/>
      <line x1="220" y1="371.43" x2="1450" y2="371.43" class="grid"/>
      <line x1="220" y1="494.29" x2="1450" y2="494.29" class="grid"/>
      <line x1="220" y1="617.14" x2="1450" y2="617.14" class="grid"/>
      <line x1="220" y1="740" x2="1450" y2="740" class="baseline"/>

      <text x="195" y="318" text-anchor="end" class="text axis-label">35,000</text>
      <text x="195" y="379" text-anchor="end" class="text axis-label">30,000</text>
      <text x="195" y="502" text-anchor="end" class="text axis-label">20,000</text>
      <text x="195" y="625" text-anchor="end" class="text axis-label">10,000</text>
      <text x="195" y="748" text-anchor="end" class="text axis-label">0</text>
    </g>

    <g id="year-guides">
      <line x1="360" y1="310" x2="360" y2="740" stroke="#D4CEC3" stroke-width="1.5"/>
      <line x1="820" y1="310" x2="820" y2="740" stroke="#D4CEC3" stroke-width="1.5"/>
      <line x1="1280" y1="310" x2="1280" y2="740" stroke="#D4CEC3" stroke-width="1.5"/>
      <text x="360" y="787" text-anchor="middle" class="text year">1960</text>
      <text x="820" y="787" text-anchor="middle" class="text year">1990</text>
      <text x="1280" y="787" text-anchor="middle" class="text year">2020</text>
    </g>

    <g id="ghana-series" aria-label="Ghana: 1,101 in 1960; 856 in 1990; 1,970 in 2020">
      <path d="M360,726.48 L820,729.48 L1280,715.79" fill="none" stroke="#B95332" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <use href="#ghana-circle" xlink:href="#ghana-circle" x="344" y="710.48" width="32" height="32"/>
      <use href="#ghana-circle" xlink:href="#ghana-circle" x="804" y="713.48" width="32" height="32"/>
      <use href="#ghana-circle" xlink:href="#ghana-circle" x="1264" y="699.79" width="32" height="32"/>
    </g>

    <g id="korea-series" aria-label="South Korea: 1,038 in 1960; 9,673 in 1990; 33,216 in 2020">
      <path d="M360,727.25 L820,621.17 L1280,331.92" fill="none" stroke="#315A78" stroke-width="7" stroke-dasharray="24 15" stroke-linecap="butt" stroke-linejoin="round"/>
      <use href="#korea-diamond" xlink:href="#korea-diamond" x="342" y="709.25" width="36" height="36"/>
      <use href="#korea-diamond" xlink:href="#korea-diamond" x="802" y="603.17" width="36" height="36"/>
      <use href="#korea-diamond" xlink:href="#korea-diamond" x="1262" y="313.92" width="36" height="36"/>
    </g>

    <g id="value-labels">
      <path d="M348,716 L310,690 L270,690" class="leader"/>
      <use href="#ghana-circle" xlink:href="#ghana-circle" x="248" y="675" width="26" height="26"/>
      <text x="283" y="696" class="text value">$1,101</text>

      <path d="M372,721 L405,676 L443,676" class="leader"/>
      <use href="#korea-diamond" xlink:href="#korea-diamond" x="438" y="659" width="30" height="30"/>
      <text x="478" y="682" class="text value">$1,038</text>

      <text x="820" y="586" text-anchor="middle" class="text value">$9,673</text>
      <text x="820" y="704" text-anchor="middle" class="text value">$856</text>

      <use href="#korea-diamond" xlink:href="#korea-diamond" x="1302" y="300" width="32" height="32"/>
      <text x="1345" y="323" class="text country">South Korea</text>
      <text x="1345" y="355" class="text value">$33,216</text>

      <use href="#ghana-circle" xlink:href="#ghana-circle" x="1304" y="674" width="28" height="28"/>
      <text x="1345" y="696" class="text country">Ghana</text>
      <text x="1345" y="728" class="text value">$1,970</text>
    </g>
  </g>

  <g id="reading-notes">
    <text x="100" y="842" class="text note-head">Observed anchors only.</text>
    <text x="355" y="842" class="text note">Straight connectors guide the eye; they do not show or estimate annual values between the three years.</text>

    <line x1="100" y1="875" x2="1500" y2="875" stroke="#B7B0A4" stroke-width="2"/>
    <text x="100" y="915" class="text note-head">What this cannot prove</text>
    <text x="100" y="948" class="text note">The GDP-per-person gap does not identify whether culture, policy, institutions, war, aid, or another factor caused the divergence. 2020 is the COVID-19 year.</text>
  </g>

  <g id="figure-note">
    <line x1="100" y1="980" x2="1500" y2="980" stroke="#514E48" stroke-width="3"/>
    <text x="100" y="1017" class="text note">
      <tspan font-style="italic">Note.</tspan>
      <tspan> GDP per capita in constant 2015 US dollars. Data from </tspan>
      <tspan font-style="italic">World Development Indicators</tspan>
      <tspan> (indicator NY.GDP.PCAP.KD), by World Bank (2026).</tspan>
    </text>
    <a href="https://databank.worldbank.org/source/world-development-indicators" xlink:href="https://databank.worldbank.org/source/world-development-indicators" target="_blank">
      <text x="100" y="1050" class="text note" text-decoration="underline">https://databank.worldbank.org/source/world-development-indicators</text>
    </a>
    <text x="100" y="1080" class="text note">Retrieved October 4, 2026 · Source ID SRC-WDI-001 · Frozen chart data: data/charts/ghana_korea_gdp_per_capita.csv</text>
  </g>
</svg>
