<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="chart-title chart-desc">
  <title id="chart-title">Observed GDP per capita at 1960, 1990, 2020: six paths on one shared axis</title>
  <desc id="chart-desc">A 1280 by 720 classroom-format version of the six-country dashboard. Each of the six panels shares the same 0 to 35,000 constant 2015 US dollar vertical axis and the same 1960, 1990, 2020 horizontal positions. Row 1 (Africa) shows Ghana (terracotta circles, 1101; 856; 1970), Botswana (green squares, 394; 4039; 6254) and Mauritius (ochre triangles with charcoal keyline and under-stroke, 1419; 3846; 9534). Row 2 (Asia) shows South Korea (blue diamonds with long-dashed connector, 1038; 9673; 33216), Malaysia (jade hexagons, 1266; 4185; 10171) and the Philippines (red cross with charcoal under-stroke, 1124; 1704; 3199). Malaysia 1960 is a retrospective territorial series across the 1963 formation of Malaysia; 2020 is the COVID-19 year for all six countries. Straight connectors join observed anchors only. The chart cannot establish whether culture, policy, institutions, war, aid, or another factor caused the gaps, and it is not a uniform Africa-versus-Asia race.</desc>
  <metadata>
    Chart ID: VIS-006-GDP-16X9.
    Frozen full-precision observations (NY.GDP.PCAP.KD, constant 2015 US dollars per person):
    Ghana: 1960=1100.76305218242; 1990=855.85250708181; 2020=1970.19411460398.
    Botswana: 1960=393.861742487166; 1990=4039.46544455099; 2020=6254.24806241091.
    Mauritius: 1960=1419.4048237128; 1990=3846.40593009531; 2020=9533.5982796049.
    South Korea: 1960=1037.72899231615; 1990=9672.57845182894; 2020=33215.9298928108.
    Malaysia: 1960=1266.31525712689; 1990=4184.76072928976; 2020=10171.4657842762.
    Philippines: 1960=1123.78209980486; 1990=1704.07568899121; 2020=3198.66690008413.
    Geometry: viewBox 1280x720. Row 1 plot y range 105..305; Row 2 plot y range 368..568. Plot height per row = 200 units. Shared domain 0..35000 constant 2015 US dollars. y = y_baseline - value * 4 / 700 where y_baseline is 305 (Row 1) or 568 (Row 2). Panel x positions: Panel 1 x=125, 270, 415. Panel 2 x=525, 670, 815. Panel 3 x=925, 1070, 1215.
    Source: SRC-WDI-001; World Bank (2026), World Development Indicators; indicator NY.GDP.PCAP.KD; WDI API v2 source 2; release 2026-07-13; retrieved 2026-10-06; https://databank.worldbank.org/source/world-development-indicators.
    Frozen data: data/charts/six_country_gdp_anchor_years.csv.
    Specification: design/figures/SIX_COUNTRY_GDP_ANCHOR_SPEC.md.
  </metadata>

